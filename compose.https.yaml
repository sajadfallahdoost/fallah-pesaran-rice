# Use with tools/compose-production.sh; nginx's diagnostic port stays on loopback.
services:
  proxy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nginx
    restart: unless-stopped
    mem_limit: 96m
    memswap_limit: 192m
    cpus: 0.40

volumes:
  caddy_data:
  caddy_config:
