# Single public origin: Django handles the API, admin, payment callbacks and static files;
# nginx serves uploaded media; everything else is the Next.js storefront.
# TLS is expected to terminate in front of this container (see docs/DEPLOYMENT.md).

upstream backend { server backend:8000; keepalive 16; }
upstream storefront { server frontend:3000; keepalive 16; }

map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 12m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $http_host;

    # Cache revalidation is called by Django over the internal network only.
    location = /api/revalidate { return 404; }

    location ~ ^/(api/v1|api/health|admin|bankgateways|payments|static)(/|$) {
        proxy_pass http://backend;
        proxy_read_timeout 60s;
    }

    location /media/ {
        alias /data/media/;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        expires 7d;
        access_log off;
    }

    location /_next/static/ {
        proxy_pass http://storefront;
        expires 365d;
        access_log off;
    }

    location / {
        proxy_pass http://storefront;
    }
}
