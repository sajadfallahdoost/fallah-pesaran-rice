{% load static %}<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>درگاه آزمایشی — بدون پرداخت واقعی</title>
  <style>
    @font-face { font-family: Vazirmatn; src: url("{% static 'fonts/Vazirmatn-Regular.woff2' %}") format("woff2"); font-weight: 400; }
    @font-face { font-family: Vazirmatn; src: url("{% static 'fonts/Vazirmatn-Bold.woff2' %}") format("woff2"); font-weight: 700; }
    body { margin: 0; font-family: Vazirmatn, Tahoma, sans-serif; background: #F6F1E7; color: #202B26; }
    main { max-width: 30rem; margin: 3rem auto; padding: 2rem; background: #FFFEFA; border: 1px solid #E2D9C6; border-radius: 1rem; }
    .warning { background: #FDF3E1; border: 1px solid #B58A45; padding: .75rem 1rem; border-radius: .5rem; font-size: .9rem; }
    h1 { font-size: 1.25rem; color: #173F35; }
    .amount { font-size: 1.5rem; font-weight: 700; margin: 1rem 0; }
    form { display: grid; gap: .75rem; margin-top: 1.5rem; }
    button { font: inherit; padding: .85rem 1rem; border-radius: .6rem; border: 1px solid #173F35; cursor: pointer; }
    .primary { background: #173F35; color: #fff; }
    .secondary { background: #fff; color: #173F35; }
    button:focus-visible { outline: 3px solid #B58A45; outline-offset: 2px; }
    code { direction: ltr; unicode-bidi: isolate; }
  </style>
</head>
<body>
<main>
  <p class="warning"><strong>محیط آزمایشی:</strong> این صفحه یک درگاه شبیه‌سازی‌شده برای توسعه است. هیچ پولی جابه‌جا نمی‌شود و اطلاعات کارت پرسیده نمی‌شود.</p>
  <h1>پرداخت آزمایشی</h1>
  <p class="amount">{{ amount_display }}</p>
  <p>مرجع: <code>{{ ref }}</code></p>
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="ref" value="{{ ref }}">
    <input type="hidden" name="callback" value="{{ callback }}">
    <button class="primary" name="decision" value="paid">شبیه‌سازی پرداخت موفق</button>
    <button class="secondary" name="decision" value="canceled">انصراف از پرداخت</button>
    <button class="secondary" name="decision" value="failed">شبیه‌سازی خطای بانک</button>
    <button class="secondary" name="decision" value="timeout">شبیه‌سازی پاسخ‌ندادن بانک در تأیید</button>
  </form>
</main>
</body>
</html>
